modelRoles:
  smol: opencode-go/deepseek-v4.1-flash:low
  slow: opencode-go/glm-5.3-flash:high
  plan: anthropic/claude-opus-5-5:high
  task: opencode-go/deepseek-v4.1-flash
  advisor: anthropic/claude-sonnet-5-5:high
  vision: opencode-go/deepseek-v4.1-flash
  commit: opencode-go/deepseek-v4.1-flash:low
  tiny: opencode-go/deepseek-v4.1-flash:low
  memory: opencode-go/deepseek-v4.1-flash:low
  judge: "typesafe/jev-1.13-free,@smol"
defaultThinkingLevel: auto
providers:
  autoThinkingMaxEffort: max
features:
  unexpectedStopDetection: smart
symbolPreset: nerd
composer:
  shape: claude
  tokenRate: false
theme:
  dark: claude-code
  light: light
setupVersion: 2
memory:
  backend: local
hideThinkingBlock: true
statusLine:
  separator: block
  sessionAccent: false
  transparent: true
  compactThinkingLevel: true
  showHookStatus: false
  preset: custom
  leftSegments:
    - mode
    - model
    - path
    - git
    - pr
  rightSegments:
    []
  contextLine: embedded
tui:
  resizeScrollback: rebuild
  titleSpinner: braille
  hyperlinks: auto
  reactions: false
terminal:
  showProgress: true
display:
  shimmer: classic
  showTokenUsage: false
  pinnedAgents: "off"
personality: pragmatic
retry:
  waitForUsageReset: true
  fallbackChains:
    anthropic/claude-opus-5-5:
      - opencode-go/glm-5.3-flash:high
    anthropic/claude-sonnet-5-5:
      - opencode-go/mimo-v2.6-flash:high
autolearn:
  enabled: true
bash:
  enabled: true
todo:
  eager: always
task:
  maxRuntimeMs: 0
  eager: preferred
  enableLsp: true
spelling:
  typoDetection: false
  autocomplete: ngram
recap:
  enabled: false
tools:
  intentTracing: false
  approvalMode: yolo
startup:
  quiet: true
  changelogMode: hidden
advisor:
  enabled: true
  reviewMode: agent-end
  syncBacklog: "3"
lsp:
  diagnosticsOnEdit: true
skills:
  enableClaudeUser: false
dev:
  autoqaConsent: denied
steeringMode: one-at-a-time
completion:
  notify: "off"
stt:
  enabled: true
  submitTrigger: say-submit
marketplace:
  autoUpdate: auto
astGrep:
  enabled: true
computer:
  enabled: true
vault:
  enabled: true
github:
  enabled: true
security:
  enabled: true
commands:
  enableClaudeUser: false
  enableOpencodeUser: false
disabledExtensions:
  - extension-module:session-branch-widget